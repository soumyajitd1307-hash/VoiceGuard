name: Deploy VoiceGuard to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build VoiceGuard
        # Production backend origin: configure as GitHub Actions VARIABLES
        # (repository Settings -> Secrets and variables -> Actions -> Variables):
        #   VITE_API_BASE_URL  e.g. https://<render-service>.onrender.com/api/v1
        #   VITE_WS_URL        e.g. wss://<render-service>.onrender.com/ws/calls
        #   VITE_AUDIO_WS_URL  e.g. wss://<render-service>.onrender.com/ws/audio
        #   VITE_SIGNAL_WS_URL e.g. wss://<render-service>.onrender.com/ws/signal
        # Unset variables fall back to the localhost defaults in the services,
        # so local `npm run build` behavior is unchanged.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_AUDIO_WS_URL: ${{ vars.VITE_AUDIO_WS_URL }}
          VITE_SIGNAL_WS_URL: ${{ vars.VITE_SIGNAL_WS_URL }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
